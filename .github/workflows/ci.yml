name: CI

# Runs the whole rigor suite on every push and PR: the randomized concurrency
# checker, the dependency baselines, the chaos and event-replay harnesses, the
# schema-drift check, and the frontend typecheck and build. The correctness
# claims in the README are only worth anything if they are enforced continuously,
# so this is where they are.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: concurrent_chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Prisma needs the schema param; the app strips it in to_async_dsn().
      DATABASE_URL: postgresql://chat:chat@localhost:5432/concurrent_chat?schema=public
      REDIS_URL: redis://localhost:6379/0
      # No provider in CI: the chaos/replay harnesses patch the model directly,
      # and this keeps anything else from reaching out.
      USE_FAKE_LLM: "true"
      # test_auth_http.py's WebSocket test triggers app startup via TestClient;
      # the app refuses to boot with the default JWT secret, so CI needs a real one.
      JWT_SECRET: "ci-test-secret-not-for-production-use"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply migrations (Prisma owns the schema)
        run: |
          npm ci
          npm run migrate:deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Schema mirror matches the database
        working-directory: backend
        run: python -m scripts.check_schema

      - name: HTTP auth/authz (signup, login, ownership, WS token gating)
        working-directory: backend
        run: pytest tests -q

      - name: Concurrency invariants (randomized interleavings)
        working-directory: backend
        run: python -m scripts.concurrency_sim --runs 5000

      # eval_dependency exits non-zero when the heuristic misclassifies a case it
      # had previously decided correctly, so this is the only step that can
      # actually fail on a dependency-detection regression. It was not in CI at
      # all, despite costing nothing to run -- no provider, no quota.
      - name: Dependency heuristic (regression gate)
        working-directory: backend
        run: python -m scripts.eval_dependency

      # These two report metrics and always exit 0, so they inform rather than
      # gate. Kept for the numbers in the log; the gate above is what fails.
      - name: Dependency baselines (free strategies, both case sets)
        working-directory: backend
        run: |
          python -m scripts.eval_baselines --cases base
          python -m scripts.eval_baselines --cases adversarial

      - name: Chaos / fault injection
        working-directory: backend
        run: python -m scripts.chaos_test

      - name: Event sourcing — projection equals the row
        working-directory: backend
        run: python -m scripts.event_replay

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # ESLint was configured (.eslintrc.json, a lint script) but never run by
      # anything, so the config was decoration.
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      # The runner stage is what a deployment actually builds, and nothing in CI
      # exercised it -- which is how it came to reference a frontend/public
      # directory that did not exist, breaking every production image build while
      # the pipeline stayed green.
      - name: Production image builds
        run: docker build --target runner -t inflight-frontend:ci .
