name: CI

# Runs the whole rigor suite on every push and PR: the randomized concurrency
# checker, the dependency baselines, the chaos and event-replay harnesses, the
# schema-drift check, and the frontend typecheck and build. The correctness
# claims in the README are only worth anything if they are enforced continuously,
# so this is where they are.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: concurrent_chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Prisma needs the schema param; the app strips it in to_async_dsn().
      DATABASE_URL: postgresql://chat:chat@localhost:5432/concurrent_chat?schema=public
      REDIS_URL: redis://localhost:6379/0
      # No provider in CI: the chaos/replay harnesses patch the model directly,
      # and this keeps anything else from reaching out.
      USE_FAKE_LLM: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply migrations (Prisma owns the schema)
        run: |
          npm ci
          npm run migrate:deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Schema mirror matches the database
        working-directory: backend
        run: python -m scripts.check_schema

      - name: HTTP auth/authz (signup, login, ownership, WS token gating)
        working-directory: backend
        run: pytest tests -q

      - name: Concurrency invariants (randomized interleavings)
        working-directory: backend
        run: python -m scripts.concurrency_sim --runs 5000

      - name: Dependency baselines (free strategies, both case sets)
        working-directory: backend
        run: |
          python -m scripts.eval_baselines --cases base
          python -m scripts.eval_baselines --cases adversarial

      - name: Chaos / fault injection
        working-directory: backend
        run: python -m scripts.chaos_test

      - name: Event sourcing — projection equals the row
        working-directory: backend
        run: python -m scripts.event_replay

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
