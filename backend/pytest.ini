[pytest]
asyncio_mode = auto
# Pin async fixtures to the test's own loop, so tests/conftest.py tears the
# connection pools down on the loop that opened them. Also settles the scope
# pytest-asyncio warns about leaving unset.
asyncio_default_fixture_loop_scope = function
# Tests import the app as `app.*`. pytest's prepend import mode only puts the
# test file's own directory (backend/tests) on sys.path, so without this the
# package is invisible when CI runs `pytest tests -q` from backend/.
pythonpath = .
